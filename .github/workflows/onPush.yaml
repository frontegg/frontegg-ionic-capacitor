name: Push Workflow
on:
  # When commit pushed to branches not master nad release/next
  push:
    branches-ignore:
      - 'master'
      - 'release/next'
env:
  CI: true
jobs:
  lint-build:
    name: 'Lint | Build'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: npm run lint

      - name: Check licenses
        id: check_licenses
        run: |
          npm install -g license-checker
          license-checker --failOn "AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;LGPL-2.0-only;LGPL-2.0-or-later;LGPL-2.1-only;LGPL-2.1-or-later;LGPL-3.0-only;LGPL-3.0-or-later;LGPLLR;MPL-1.1"
      - name: Build Package
        run: |
          npm run build

  lint-example:
    name: 'Lint example app'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Lint example app
        working-directory: example
        run: npx ng lint

  # E2E mock suites. Non-blocking until they have run green on CI; then drop
  # continue-on-error so these gate the build.
  e2e-ios-mock:
    name: 'E2E | iOS mock suites'
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Build web assets and sync iOS
        working-directory: example
        run: npm run build && npx cap sync ios

      - name: Run mock e2e suites
        working-directory: example
        run: |
          # Resolve a simulator that exists on this runner image rather than
          # pinning a model that a future image may drop.
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9][^(]*' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          # Sign ad hoc: an unsigned app has no entitlements, so Keychain writes fail and sessions do not survive a relaunch.
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            -only-testing:AppUITests/MockSessionUITests \
            -only-testing:AppUITests/MockTokenExpiryUITests \
            -only-testing:AppUITests/MockConnectivityUITests \
            test

  e2e-android-mock:
    name: 'E2E | Android mock suites'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Build web assets and sync Android
        working-directory: example
        run: npm run build && npx cap sync android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mock e2e suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: example/android
          # On failure, print the plugin and SDK log lines that show which server each init and page load used.
          script: adb logcat -G 16M; ./gradlew :app:connectedDebugAndroidTest -PfronteggEmbeddedLogin -Pandroid.testInstrumentationRunnerArguments.class=com.frontegg.demo.MockConnectivityTest,com.frontegg.demo.MockTokenExpiryTest || (adb logcat -d | grep -iE "FronteggNative|FronteggWebClient|FronteggAuth|refresh token|TestRunner" | grep -v "istener" | tail -n 500; exit 1)
  
